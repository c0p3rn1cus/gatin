[package]
name = "gatin"
version = "0.2.2"
edition = "2024"
description = "Cross-platform desktop pet black cat that types, uses the mouse, and loves being petted"
license = "MIT"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.33.3"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8.23"
directories = "6.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["wgpu"] }
wgpu = { version = "27.0.1", default-features = false, features = ["dx12", "vulkan", "wgsl", "std"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
